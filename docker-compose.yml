services:
  # PostgreSQL - Metadata Database
  postgres:
    image: postgres:15-alpine
    container_name: dbchat_postgres
    environment:
      POSTGRES_DB: dbchat_metadata
      POSTGRES_USER: dbchat
      POSTGRES_PASSWORD: dbchat_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbchat_network

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: dbchat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbchat_network

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dbchat_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT_API_KEY: your_qdrant_api_key_here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbchat_network

  # Ollama - LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: dbchat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dbchat_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_storage:
    driver: local
  ollama_data:
    driver: local

networks:
  dbchat_network:
    driver: bridge
